<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8edf2">
<title>Escribe</title>
<style>
:root{--bg:#e8edf2;--card:#f6f8fa;--line:#cdd6de;--text:#1d2630;--muted:#667585;--ghost:#9aa8b5;--ink:#1f3a93;--err:#c2255c;--errbg:#f8d7e3;--btn:#1f3a93;--btntx:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141922;--card:#1c232e;--line:#2c3644;--text:#e6ebf1;--muted:#8d9aab;--ghost:#566274;--ink:#8fb4ff;--err:#ff7aa5;--errbg:#4a2236;--btn:#8fb4ff;--btntx:#101826}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{display:none;height:100%;flex-direction:column;padding:20px;gap:14px;max-width:720px;margin:0 auto}
.view.on{display:flex}
h1{font:600 28px/1.15 Georgia,serif;margin:8px 0 0}
p.sub{margin:0;color:var(--muted)}
#src{flex:1;min-height:0;resize:none;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:16px;font:18px/1.6 Georgia,serif}
#src:focus{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center}
.count{color:var(--muted);font-size:14px;margin-right:auto}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;min-height:48px}
.pri{background:var(--btn);color:var(--btntx)}
.pri:disabled{opacity:.4}
.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px}
.top .sec{padding:10px 14px;min-height:44px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font:600 22px Georgia,serif;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
#fill{height:100%;width:0;background:var(--ink);transition:width .15s}
#reader{flex:1;min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;font:23px/1.75 Georgia,serif;color:var(--ghost);white-space:pre-wrap;overflow-wrap:anywhere}
.w{display:inline-block}
#reader .ok{color:var(--ink)}
#reader .bad{color:var(--err);background:var(--errbg);border-radius:3px;text-decoration:underline}
#reader .cur{box-shadow:inset 2px 0 0 var(--ink);animation:b 1s steps(2) infinite}
@keyframes b{50%{box-shadow:none}}
@media(prefers-reduced-motion:reduce){#reader .cur{animation:none}#fill{transition:none}}
.hint{text-align:center;color:var(--muted);font-size:14px}
#inp{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--text);padding:24px;width:min(88vw,360px)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog h2{font:600 24px Georgia,serif;margin:0 0 16px}
.res{display:flex;gap:24px;margin-bottom:20px}
.res .stat b{font-size:30px}
dialog .row{flex-direction:column;align-items:stretch}
</style>
</head>
<body>
<main class="view on" id="v1">
  <h1>Escribe para aprender</h1>
  <p class="sub">Pega un texto y cópialo letra por letra. Lo que aciertas se tiñe de azul.</p>
  <textarea id="src" placeholder="Pega aquí el texto que quieres practicar" aria-label="Texto a practicar"></textarea>
  <div class="row"><span class="count" id="cnt">0 caracteres</span><button class="sec" id="paste">Pegar</button></div>
  <button class="pri" id="go" disabled>Empezar a escribir</button>
</main>
<main class="view" id="v2">
  <div class="top">
    <button class="sec" id="back">Cambiar texto</button>
    <div class="stat"><b id="wpm">0</b><span>pal/min</span></div>
    <div class="stat"><b id="acc">100%</b><span>precisión</span></div>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div id="reader" aria-label="Texto a copiar"></div>
  <p class="hint">Toca el texto si el teclado se cierra</p>
  <textarea id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Escribe aquí"></textarea>
</main>
<dialog id="dlg">
  <h2>Texto completado</h2>
  <div class="res">
    <div class="stat"><b id="rw">0</b><span>pal/min</span></div>
    <div class="stat"><b id="ra">0%</b><span>precisión</span></div>
    <div class="stat"><b id="rt">0s</b><span>tiempo</span></div>
  </div>
  <div class="row"><button class="pri" id="again">Repetir</button><button class="sec" id="fresh">Texto nuevo</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s), KEY='escribe.texto';
const src=$('#src'), inp=$('#inp'), rd=$('#reader'), dlg=$('#dlg');
let txt='', spans=[], prev=0, t0=0, done=false;
try{src.value=localStorage.getItem(KEY)||''}catch(e){}
function chk(){const n=src.value.trim().length;$('#cnt').textContent=n+' caracteres';$('#go').disabled=!n}
src.addEventListener('input',chk);chk();
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id))}
$('#paste').onclick=async()=>{
  try{
    const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Clipboard;
    const t=P?(await P.read()).value:await navigator.clipboard.readText();
    if(t){src.value=t;chk()}
  }catch(e){src.focus()}
};
function build(){
  rd.innerHTML='';spans=[];prev=0;t0=0;done=false;inp.value='';
  let w=null;
  for(let i=0;i<txt.length;i++){
    const s=document.createElement('span');s.textContent=txt[i];
    if(txt[i]===' '){rd.append(s);w=null}
    else{if(!w){w=document.createElement('span');w.className='w';rd.append(w)}w.append(s)}
    spans.push(s);
  }
  spans[0].className='cur';rd.scrollTop=0;
  $('#wpm').textContent='0';$('#acc').textContent='100%';$('#fill').style.width='0';
}
$('#go').onclick=()=>{
  txt=src.value.replace(/\s+/g,' ').trim();if(!txt)return;
  try{localStorage.setItem(KEY,src.value)}catch(e){}
  build();show('v2');inp.focus();
};
function render(){
  let v=inp.value;
  if(v.length>txt.length){v=v.slice(0,txt.length);inp.value=v}
  const n=v.length, lo=Math.max(0,Math.min(prev,n)-1), hi=Math.min(txt.length-1,Math.max(prev,n)+1);
  for(let i=lo;i<=hi;i++)spans[i].className=i<n?(v[i]===txt[i]?'ok':'bad'):(i===n?'cur':'');
  prev=n;
  if(n&&!t0)t0=Date.now();
  let ok=0;for(let i=0;i<n;i++)if(v[i]===txt[i])ok++;
  const min=t0?(Date.now()-t0)/60000:0, wpm=min>0.005?Math.round(ok/5/min):0, acc=n?Math.round(ok/n*100):100;
  $('#wpm').textContent=wpm;$('#acc').textContent=acc+'%';
  $('#fill').style.width=(n/txt.length*100)+'%';
  spans[Math.min(n,txt.length-1)].scrollIntoView({block:'center'});
  inp.setSelectionRange(n,n);
  if(n>=txt.length&&!done){
    done=true;inp.blur();
    $('#rw').textContent=wpm;$('#ra').textContent=acc+'%';
    $('#rt').textContent=Math.round((Date.now()-t0)/1000)+'s';
    dlg.showModal();
  }
}
inp.addEventListener('input',render);
rd.addEventListener('click',()=>inp.focus());
$('#back').onclick=()=>{inp.blur();show('v1')};
$('#again').onclick=()=>{dlg.close();build();inp.focus()};
$('#fresh').onclick=()=>{dlg.close();show('v1')};
</script>
</body>
</html>
